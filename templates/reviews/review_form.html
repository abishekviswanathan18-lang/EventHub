{% extends 'base.html' %}
{% block title %}Write a Review - EventHub{% endblock %}

{% block content %}
    <div class="card" style="max-width:450px; margin:0 auto; padding:32px;">
        <h2>Review "{{ event.title }}"</h2>
        <form method="POST" style="margin-top:20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Submit Review</button>
        </form>
        <a href="{% url 'event_detail' event.pk %}" style="display:block; margin-top:16px; text-align:center; color:#059669; font-weight:600; font-size:14px;">← Back to Event</a>
    </div>
{% endblock %}
