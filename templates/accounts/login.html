{% extends 'base.html' %}
{% block title %}Login - EventHub{% endblock %}

{% block content %}
<div
    style="max-width:960px; margin:20px auto; display:grid; grid-template-columns: 1fr 1fr; border-radius:20px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.08);">

    <div
        style="background:linear-gradient(135deg,#0f172a,#064e3b,#059669); padding:50px 40px; display:flex; flex-direction:column; justify-content:center; color:white;">
        <div style="font-size:40px;">🎟️</div>
        <h2 style="color:white; margin-top:16px; font-size:26px;">Welcome back to EventHub</h2>
        <p style="color:#a7f3d0; margin-top:10px; font-size:14px; line-height:1.6;">
            Log in to book tickets, track your bookings, and never miss an event again.
        </p>
    </div>

    <div style="background:white; padding:50px 40px; display:flex; flex-direction:column; justify-content:center;">
        <h2>Login</h2>
        <form method="POST" style="margin-top:20px;">
            {% csrf_token %}
            <p>
                <label>Username</label>
                <input type="text" name="username" required>
            </p>
            <p>
                <label>Password</label>
                <input type="password" name="password" required>
            </p>
            <button type="submit" class="btn btn-primary"
                style="width:100%; margin-top:8px; padding:14px;">Login</button>
        </form>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const input = document.getElementById('login-password');
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                const toggle = document.createElement('span');
                toggle.textContent = '👁️';
                toggle.style.cssText = 'position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:15px; opacity:0.6;';
                wrapper.appendChild(toggle);

                toggle.addEventListener('click', function () {
                    if (input.type === 'password') {
                        input.type = 'text';
                        toggle.textContent = '🙈';
                    } else {
                        input.type = 'password';
                        toggle.textContent = '👁️';
                    }
                });
            });
        </script>
        <p style="margin-top:18px; font-size:14px; text-align:center;">
            Don't have an account? <a href="{% url 'register' %}" style="color:#059669; font-weight:700;">Register</a>
        </p>
    </div>

</div>
{% endblock %}
