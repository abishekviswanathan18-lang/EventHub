{% extends 'base.html' %}
{% block title %}Add Photo - EventHub{% endblock %}

{% block content %}
    <div class="card" style="max-width:420px; margin:0 auto; padding:32px;">
        <h2>Add Photo</h2>
        <p style="font-size:14px; margin-top:4px;">for "{{ event.title }}"</p>
        <form method="POST" enctype="multipart/form-data" style="margin-top:20px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Upload Photo</button>
        </form>
        <a href="{% url 'event_detail' event.pk %}" style="display:block; margin-top:16px; text-align:center; color:#059669; font-weight:600; font-size:14px;">← Back to Event</a>
    </div>
{% endblock %}
